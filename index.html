let evT="",evQ="",tab="home",members=[],events=[],db=null,uid=null,me=null,isTeacher=false,saved="",fG="",fC="";
const $=s=>document.getElementById(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opts=(a,v,ph)=>(ph?`<option value="">${ph}</option>`:"")+a.map(x=>`<option ${x==v?"selected":""}>${esc(x)}</option>`).join("");
function drawNav(){const t=[["home","🏠 Home"],["adv","👩‍🏫 Advisors"],["info","ℹ️ Club Info"],["evg","🏅 Events Guide"],["events","📅 Events"]];if(isTeacher)t.push(["teacher","📊 Teacher View"]);
$("nav").innerHTML=t.map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
function go(t){const j=t=="join"||t=="acct";tab=j?"home":t;saved="";render();if(j){const e=$("signup");e&&e.scrollIntoView({behavior:"smooth"})}}
function upcoming(){const today=ymd(new Date());return events.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date))}
function evHTML(list){return list.length?list.map(e=>{const d=new Date(e.date+"T12:00:00");return `<div class="ev"><div class="date">${d.toLocaleString("en-US",{month:"short"})}<small></small>${d.getDate()}</div><div><b>${esc(e.title)}</b>${e.src?` <span class="tag">${esc(e.src)}</span>`:""}${e.time?` · ${esc(e.time)}`:""}<div class="mu">${esc(e.place||"")} ${esc(e.notes||"")}</div>${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">Details on fbla.org ↗</a>`:""}${isTeacher?`<a href="#" onclick="delEv('${e.id}');return false" class="mu">remove</a>`:""}</div></div>`}).join(""):`<p class="mu">No upcoming events posted yet. Check back soon!</p>`}
function flipHTML(k,label,f){const l=pub.filter(f);const cats=CATS.map(c=>[c,l.filter(x=>x.cat==c).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,3);const tm=l.filter(x=>x.teaming=="Yes").length;
return `<div class="flip" role="button" tabindex="0" aria-pressed="false" onclick="this.classList.toggle('on');this.setAttribute('aria-pressed',this.classList.contains('on'))" onkeydown="if(event.key=='Enter'||event.key==' '){event.preventDefault();this.click()}"><div class="in"><div class="face card stat"><b>${l.length}</b><span>${label}</span><small class="mu">tap to flip</small></div><div class="face back card"><div class="bk"><b>${l.length} · ${label}</b><div>${GRADES.map(g=>`Gr ${g}: <b>${l.filter(x=>x.grade==g).length}</b>`).join(" · ")}</div><div class="mu">Top events: ${cats.map(([c,n])=>esc(c)+" ("+n+")").join(", ")||"none yet"}</div><div class="mu">${tm} teaming up</div><button class="btn" onclick="event.stopPropagation();stat('${k}')">Full details →</button></div></div></div></div>`}
function render(){drawNav();const m=$("main");
if(tab=="home"){const u=upcoming().slice(0,3);m.innerHTML=`<div class="card"><h2>Welcome, future business leaders! 👋</h2><p>FBLA helps middle schoolers build skills in business, leadership and public speaking. Use this dashboard to <b>sign up</b>, pick a <b>competition category</b>, find a <b>teammate</b>, and see <b>important dates</b> — all in one place.</p><button class="btn" onclick="go('join')">${me?"Update my sign-up":"Sign up now"}</button></div>
<div class="grid">${flipHTML("all","Students enrolled",()=>true)}${flipHTML("reg","Registered for regional tryouts",x=>x.level&&x.level.startsWith("Regional"))}${flipHTML("state","Registered for state tryouts",x=>x.level&&x.level.startsWith("Regional +"))}</div>
<div class="card"><h2>📅 Next up</h2>${evHTML(u)}</div>
${acctHTML()}${joinHTML()}<div class="card"><h2>❓ Questions?</h2><p>Contact your <a href="#" onclick="go('adv');return false">FBLA advisors</a> or your FBLA Secretary, <b>Shranav Vinodh</b>: <a href="mailto:svinodh@students.wcpss.net">svinodh@students.wcpss.net</a></p></div>`}
else if(tab=="events"){m.innerHTML=`<div class="card"><h2>📅 Important dates</h2><div class="seg"><button class="btn ${evView=="cal"?"":"alt"}" onclick="setEv('cal')">📆 Calendar</button> <button class="btn ${evView=="list"?"":"alt"}" onclick="setEv('list')">📋 List</button></div>${evView=="cal"?calHTML():evHTML(upcoming())}</div><div class="card"><h3>🌎 FBLA national middle school events</h3><p class="mu">Webinars and national events from FBLA are added above. Stay current with the official calendar:</p><p><a href="https://www.fbla.org/events/list/?tribe_filterbar_division_custom%5B0%5D=151" target="_blank" rel="noopener">📅 See all FBLA middle school events</a></p><p><a href="https://www.google.com/calendar/render?cid=webcal%3A%2F%2Fwww.fbla.org%2F%3Fpost_type%3Dtribe_events%26tribe_filterbar_division_custom%255B0%255D%3D151%26ical%3D1%26eventDisplay%3Dlist" target="_blank" rel="noopener">➕ Subscribe in Google Calendar</a> · <a href="https://www.fbla.org/events/list/?tribe_filterbar_division_custom%5B0%5D=151&amp;ical=1" target="_blank" rel="noopener">⬇ Download .ics file</a></p></div>`+(isTeacher?`<div class="card"><h2>Add an event (teachers)</h2><div class="row"><div><label>Title</label><input id="e_t"></div><div><label>Date</label><input id="e_d" type="date"></div><div><label>Time</label><input id="e_ti" placeholder="3:30 PM"></div><div><label>Place</label><input id="e_p"></div></div><label>Notes</label><input id="e_n"><button class="btn" onclick="addEv()">Post event</button></div>`:"")}
else if(tab=="evg"){m.innerHTML=`<div class="card"><h2>🏅 2026–27 Competitive Events</h2><p>This year's FBLA theme is <b>Where Leaders Begin</b>. Find an event that fits you, then open its guidelines.</p><p><span class="tag">⭐ Oct 20 tryouts</span> objective-testing tryouts at our school &nbsp; <span class="tag">📍 Starts at Regionals</span> events that begin at the regional level</p><div class="row"><div><label>Event type</label><select onchange="evT=this.value;drawEv()">${["",...Object.keys(TY)].map(k=>`<option value="${k}" ${k==evT?"selected":""}>${k?TY[k]:"All types"}</option>`).join("")}</select></div><div><label>Search</label><input value="${esc(evQ)}" placeholder="e.g. finance, speech…" oninput="evQ=this.value;drawEv()"></div></div></div><div id="evl"></div><div class="card"><h3>📚 Helpful links</h3>${RES.map(([t,u])=>`<p><a href="${u}" target="_blank" rel="noopener">${t}</a></p>`).join("")}<p class="mu">🔒 Needs an FBLA Connect login – ask your advisor.</p></div>`;drawEv()}
else if(tab=="stat"){const T={all:["👥 All enrolled students",x=>true,""],reg:["Registered for regional tryouts",x=>x.level&&x.level.startsWith("Regional"),"Includes students who also hope to advance to State."],state:["Registered for state tryouts",x=>x.level&&x.level.startsWith("Regional +"),"These students plan to compete at State if they qualify at Regionals."]}[stF];const l=pub.filter(T[1]);const cats=CATS.map(c=>[c,l.filter(x=>x.cat==c).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...cats.map(x=>x[1]));
m.innerHTML=`<p><a href="#" onclick="go('home');return false">← Back to Home</a></p><div class="card"><h2>${T[0]}</h2><p style="font-size:2rem;font-weight:700;color:var(--pr);margin:0">${l.length}</p><p class="mu">${T[2]}</p><h3 style="margin-top:14px">By grade</h3><div class="grid">${GRADES.map(g=>`<div class="card stat"><b>${l.filter(x=>x.grade==g).length}</b><span>Grade ${g}</span></div>`).join("")}</div><h3>By category</h3>${cats.map(([c,n])=>`<div class="bar"><span style="width:190px">${c}</span><i style="width:${n/mx*50}%;min-width:6px"></i> ${n}</div>`).join("")||`<p class="mu">No sign-ups yet.</p>`}<h3 style="margin-top:14px">Teaming</h3><p>${l.filter(x=>x.teaming=="Yes").length} teaming up · ${l.filter(x=>x.teaming=="Need a partner").length} need a partner · ${l.filter(x=>x.teaming!="Yes"&&x.teaming!="Need a partner").length} solo</p>${isTeacher?`<h3>Students</h3>${members.filter(T[1]).sort((a,b)=>a.grade.localeCompare(b.grade)||a.name.localeCompare(b.name)).map(x=>`<p>${esc(x.name)} · Gr ${esc(x.grade)} · ${esc(x.cat)}${x.sample?` <span class="tag">sample</span>`:""}</p>`).join("")}`:`<p class="mu">Student names are visible to advisors only.</p>`}</div>`}
else if(tab=="info"){const D=(t,b)=>`<details><summary>${t}</summary>${b}</details>`;m.innerHTML=`<div class="card"><h2>ℹ️ About Carnage FBLA</h2><p>FBLA (Future Business Leaders of America) is a non-profit organization that prepares today's students for success in business leadership.</p>
${D("How FBLA benefits you","<ul><li>Develop business and leadership skills</li><li>Network with students across the nation</li><li>Earn competitive recognition</li><li>Sponsorships</li><li>Looks impressive on your college application</li></ul>")}
${D("Focus of the year","<ul><li><b>Competitions:</b> Regionals, States, Nationals (placement depends on scores)</li><li>Conferences</li><li><b>Community service:</b> March of Dimes, Homeless Supply Drive, etc.</li><li>Workshops / networking</li><li>Guest speakers</li></ul>")}
